plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'io.github.uriz1991.positiveaffirmations'
    compileSdk 36

    defaultConfig {
        // See TWA_APPLICATION_ID in android/gradle.properties. Permanent on Play.
        applicationId TWA_APPLICATION_ID
        minSdk 24
        targetSdk 36
        // versionCode must increase on every Play upload and can never go back.
        versionCode 1
        versionName '1.2.52'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Debug keystore. Play Console rejects this certificate.
        }
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Same library Bubblewrap generates a project around.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'androidx.browser:browser:1.8.0'
}
